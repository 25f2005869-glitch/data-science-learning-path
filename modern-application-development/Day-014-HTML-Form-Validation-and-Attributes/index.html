<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Day 014 - HTML Form Validation and Attributes</title>

</head>

<body>

    <h1>HTML Form Validation and Attributes</h1>

    <hr>

    <p>
        This form demonstrates HTML5 form validation and commonly used
        form attributes.
    </p>

    <form action="#" method="post">

        <h2>Student Registration Form</h2>

        <!-- Full Name -->

        <label for="name">Full Name:</label>
        <br>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            minlength="3"
            maxlength="50"
            autocomplete="name"
            required>

        <br><br>


        <!-- Email -->

        <label for="email">Email:</label>
        <br>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            autocomplete="email"
            required>

        <br><br>


        <!-- Password -->

        <label for="password">Password:</label>
        <br>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Minimum 8 characters"
            minlength="8"
            maxlength="20"
            autocomplete="new-password"
            required>

        <br><br>


        <!-- Age -->

        <label for="age">Age:</label>
        <br>

        <input
            type="number"
            id="age"
            name="age"
            min="18"
            max="100"
            required>

        <br><br>


        <!-- Phone -->

        <label for="phone">Phone Number:</label>
        <br>

        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter 10-digit phone number"
            pattern="[0-9]{10}"
            title="Enter exactly 10 digits"
            autocomplete="tel"
            required>

        <br><br>


        <!-- Date of Birth -->

        <label for="dob">Date of Birth:</label>
        <br>

        <input
            type="date"
            id="dob"
            name="dob"
            required>

        <br><br>


        <!-- Gender -->

        <fieldset>

            <legend>Gender</legend>

            <input
                type="radio"
                id="female"
                name="gender"
                value="female"
                checked>

            <label for="female">Female</label>

            <br>

            <input
                type="radio"
                id="male"
                name="gender"
                value="male">

            <label for="male">Male</label>

            <br>

            <input
                type="radio"
                id="other"
                name="gender"
                value="other">

            <label for="other">Other</label>

        </fieldset>

        <br>


        <!-- Course -->

        <label for="course">Select Course:</label>
        <br>

        <select
            id="course"
            name="course"
            required>

            <option value="">-- Select Course --</option>

            <option value="mad">
                Modern Application Development
            </option>

            <option value="bdm">
                Business Data Management
            </option>

            <option value="mlt">
                Machine Learning Techniques
            </option>

        </select>

        <br><br>


        <!-- Skills -->

        <fieldset>

            <legend>Skills</legend>

            <input
                type="checkbox"
                id="html"
                name="skills"
                value="html"
                checked>

            <label for="html">HTML</label>

            <br>

            <input
                type="checkbox"
                id="css"
                name="skills"
                value="css">

            <label for="css">CSS</label>

            <br>

            <input
                type="checkbox"
                id="javascript"
                name="skills"
                value="javascript">

            <label for="javascript">JavaScript</label>

            <br>

            <input
                type="checkbox"
                id="python"
                name="skills"
                value="python">

            <label for="python">Python</label>

        </fieldset>

        <br>


        <!-- Address -->

        <label for="address">Address:</label>
        <br>

        <textarea
            id="address"
            name="address"
            rows="4"
            cols="40"
            placeholder="Enter your address"
            minlength="10"
            required></textarea>

        <br><br>


        <!-- Readonly Field -->

        <label for="programme">Programme:</label>
        <br>

        <input
            type="text"
            id="programme"
            name="programme"
            value="IIT Madras BS Degree"
            readonly>

        <br><br>


        <!-- Disabled Field -->

        <label for="status">Registration Status:</label>
        <br>

        <input
            type="text"
            id="status"
            value="Currently Unavailable"
            disabled>

        <br><br>


        <!-- Buttons -->

        <button type="submit">Submit</button>

        <button type="reset">Reset</button>

    </form>

    <hr>

    <p>
        Congratulations! You have completed Day 014.
    </p>

    <p>
        Next Topic: HTML Multimedia
    </p>

</body>

</html>
